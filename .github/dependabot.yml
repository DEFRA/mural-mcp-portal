# Dependabot configuration for automated dependency updates
#
# This config creates grouped PRs for npm dependencies and separate PRs for
# GitHub Actions. The combine-prs workflows (see .github/workflows/combine-prs-*.yaml)
# automatically consolidate these into single PRs per package manager, reducing
# management overhead while preserving the grouped update strategy.
#
# Schedule: Dependabot runs weekly on Mondays at 10:00 Europe/London (UTC+1).
# Combining: Happens Mondays at 11:00 UTC (or manually via workflow_dispatch)
#
# To manually combine PRs:
#   gh workflow run combine-prs-npm.yaml
#   gh workflow run combine-prs-github-actions.yaml

version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      build:
        patterns:
          - '@babel/*'
          - 'autoprefixer'
          - 'babel-plugin-module-resolver'
          - 'babel-loader'
          - 'babel-plugin-transform-import-meta'
          - 'tsx'
          - 'webpack'
          - 'webpack-*'
          - 'terser-webpack-plugin'

      lint:
        patterns:
          - 'prettier'
          - 'stylelint'
          - 'stylelint-*'

      logging:
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'

      tools:
        patterns:
          - 'husky'
          - 'vitest'
          - 'vitest-*'
          - 'nodemon'
          - 'npm-run-all'
          - 'lodash'
          - 'source-map-loader'
          - 'sass-*'
          - 'postcss-*'

      types:
        patterns:
          - '@types/*'

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:00'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:00'
      timezone: 'Europe/London'
